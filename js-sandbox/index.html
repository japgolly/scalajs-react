<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React 19 ESM Import</title>
</head>
<body>

    <div id="root"></div>

    <script type="module">
        // Importing React 19 from a CDN
        import React from 'https://esm.sh/react@19.2.4';
        import ReactDOM from 'https://esm.sh/react-dom@19.2.4/client';

        // Storing them in the window object
        window.React = React;
        window.ReactDOM = ReactDOM;

        // Verification
        console.log("React version:", window.React.version);

        // Example Usage: Rendering a simple element
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement('h1', null, 'React ' + React.version + ' is loaded!'));
    </script>
</body>
</html>
